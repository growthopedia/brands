<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Baby Bodega Brands</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
<meta name="theme-color" content="#e3ece6">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon.svg">
<link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Brands">
<style>
/* Baby Bodega "misty morning": sage sky, white clouds, butter-yellow sun. */
:root{
  color-scheme:light;
  --sky:#e3ece6;--sky-deep:#cbdcd2;--mist:#f3f6f2;--cloud:#fff;--ink:#26403a;--soft:#5a6f68;--line:#d9e4dc;
  --rain:#3f7364;--rain-dark:#2f5a4e;--rain-soft:rgba(63,115,100,.1);--sun:#ffd666;--sun-ink:#7a5600;--sun-soft:#fff3cc;
  --bad:#a1452f;--bad-soft:#f7e2da;--info:#476a87;--info-soft:#e2edf6;
  --head:'Fredoka','Figtree',system-ui,sans-serif;--body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  --radius:18px;--shadow:0 1px 2px rgba(38,64,58,.05),0 10px 26px -18px rgba(38,64,58,.35);
}
*{box-sizing:border-box}
body{margin:0;background:var(--mist);color:var(--ink);font:16px/1.5 var(--body);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--head);font-weight:600;letter-spacing:-.01em;margin:0}
h2{font-size:22px;margin-bottom:4px}
h3{font-size:16px}
a{color:var(--rain)}
header{position:sticky;top:0;z-index:5;background:var(--sky);border-bottom:1px solid var(--sky-deep)}
.top{display:flex;align-items:center;gap:12px;padding:12px 16px;max-width:1200px;margin:0 auto}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font:600 21px/1 var(--head);white-space:nowrap}
.logo img{width:34px;height:34px}
.logo small{font:700 11px/1 var(--body);letter-spacing:2px;text-transform:uppercase;color:var(--rain);padding-left:10px;border-left:1px solid var(--sky-deep)}
.spacer{flex:1}
.pill{font:600 12px/1 var(--body);padding:7px 12px;border-radius:99px;background:var(--cloud);color:var(--rain);white-space:nowrap}
.iconbtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--sky-deep);background:var(--cloud);display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.iconbtn svg{width:20px;height:20px}
nav{display:flex;gap:2px;padding:0 10px;max-width:1200px;margin:0 auto;overflow-x:auto;scrollbar-width:none}
nav button{border:0;background:none;color:var(--soft);padding:10px 12px;font:700 13px/1.2 var(--body);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap;position:relative}
nav button.on{color:var(--ink);border-color:var(--rain)}
nav button svg{display:none}
.count{font-size:11px;background:var(--sun);color:var(--sun-ink);border-radius:99px;padding:1px 7px;margin-left:4px;font-weight:700}
main{max-width:1200px;margin:0 auto;padding:20px 16px 60px}
.card{background:var(--cloud);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.muted{color:var(--soft)}.small{font-size:13px}
.banner{border-radius:14px;padding:12px 16px;margin-bottom:12px;font-size:14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.banner>span{flex:1;min-width:220px}
.banner.warn{background:var(--sun-soft);color:var(--sun-ink)}
.banner.info{background:var(--info-soft);color:var(--info)}
.banner.bad{background:var(--bad-soft);color:var(--bad)}
input,select,textarea{font:inherit;font-size:15px;color:var(--ink);background:var(--cloud);border:1.5px solid var(--line);border-radius:12px;padding:9px 12px;max-width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--rain);box-shadow:0 0 0 3px var(--rain-soft)}
textarea{width:100%;min-height:180px;resize:vertical;line-height:1.5}
label.f{display:block;font-weight:600;font-size:13px;margin:10px 0 4px}
label.f+input,label.f+select,label.f+textarea{width:100%}
.btn{font:600 14px/1.2 var(--body);border-radius:99px;padding:10px 18px;border:2px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none;white-space:nowrap}
.btn.primary{background:var(--rain);border-color:var(--rain);color:#fff}
.btn.primary:hover{background:var(--rain-dark);border-color:var(--rain-dark)}
.btn.sun{background:var(--sun);border-color:var(--sun);color:var(--ink)}
.btn.ghost{border-color:var(--line)}
.btn.danger{color:var(--bad);border-color:transparent}
.btn.sm{padding:6px 12px;font-size:13px;border-width:1.5px}
.btn:disabled{opacity:.45;cursor:default}
.tag{display:inline-block;font:600 11.5px/1.4 var(--body);padding:3px 10px;border-radius:99px;background:var(--mist);border:1px solid var(--line);color:var(--soft);margin:2px 4px 2px 0;white-space:nowrap}
.tag.good{background:var(--rain-soft);border-color:transparent;color:var(--rain-dark)}
.tag.warn{background:var(--sun-soft);border-color:transparent;color:var(--sun-ink)}
.tag.bad{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.tag.info{background:var(--info-soft);border-color:transparent;color:var(--info)}
.score{font:600 15px/1 var(--head);width:44px;height:44px;flex:none;display:grid;place-items:center;border-radius:50%;background:var(--sky);color:var(--rain-dark)}
.filters{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;margin-bottom:12px}
.filters input[type=search]{grid-column:span 2}
.filters>*{min-width:0;width:100%}
.brand{display:flex;gap:12px;align-items:flex-start;cursor:pointer}
.brand:hover{border-color:var(--sky-deep)}
.brand .body{flex:1;min-width:0}
.brand .name{font:600 17px/1.25 var(--head)}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{cursor:default}
.kpi .v{font:600 30px/1.1 var(--head);font-variant-numeric:tabular-nums}
.kpi .l{font-size:13px;color:var(--soft)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:700 11px/1.2 var(--body);color:var(--rain);text-transform:uppercase;letter-spacing:1.2px}
.tablewrap{overflow-x:auto}
dialog{border:0;border-radius:22px;padding:0;width:min(860px,100vw - 24px);max-height:92vh;background:var(--mist);color:var(--ink);box-shadow:0 14px 50px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(38,64,58,.4)}
.dlg-head{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--sky);z-index:2}
.dlg-body{padding:16px;overflow:auto;max-height:calc(92vh - 64px)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 12px}
.empty{text-align:center;padding:40px 16px;color:var(--soft)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--sun);padding:12px 20px;border-radius:99px;font-size:14px;z-index:30;max-width:90vw}
.sig{white-space:pre-wrap;font-size:13px;color:var(--soft);border-top:1px dashed var(--line);margin-top:8px;padding-top:8px}
.sec{display:flex;align-items:baseline;gap:10px;margin:22px 0 8px}
.sec h3{font-size:18px}
.links{display:flex;flex-wrap:wrap;gap:6px}
.lk{display:inline-flex;align-items:center;gap:5px;padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:var(--cloud);color:var(--ink);font:600 13px/1 var(--body);text-decoration:none;cursor:pointer}
.lk:hover{border-color:var(--rain)}
.lk.find{border-style:dashed;color:var(--soft)}
.asks{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.ask{display:flex;align-items:center;gap:8px;background:var(--cloud);border:1px solid var(--line);border-radius:14px;padding:8px 10px}
.ask b{flex:1;font-size:14px}
.ask select{padding:5px 8px;font-size:13px}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.chk{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:99px;padding:6px 12px;background:var(--cloud);cursor:pointer;font-size:14px}
.chk input{accent-color:var(--rain);width:16px;height:16px}
.timeline .ev{border-left:3px solid var(--line);padding:2px 0 10px 12px;margin-left:4px}
.timeline .ev.out{border-color:var(--rain)}
.timeline .ev.in{border-color:var(--sun)}
.timeline .t{white-space:pre-wrap;font-size:14px;margin-top:3px}
.research{background:var(--sun-soft);border-radius:14px;padding:12px 14px;font-size:14px}
.research ul{margin:6px 0 0;padding-left:18px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{border:1px dashed var(--line);background:transparent;border-radius:99px;padding:5px 11px;font:500 12.5px/1 var(--body);color:var(--soft);cursor:pointer}
.chip:hover{border-color:var(--rain);color:var(--rain)}
.rewrite{display:flex;gap:8px;margin-top:10px}
.rewrite input{flex:1;min-width:0}
.bars .b{display:flex;align-items:center;gap:8px;font-size:13px;margin:4px 0}
.bars .b span:first-child{width:90px;color:var(--soft)}
.bars .track{flex:1;height:10px;background:var(--mist);border-radius:6px;overflow:hidden;display:flex}
.bars .track i{display:block;height:100%}
.weeks{display:flex;align-items:flex-end;gap:6px;height:140px;padding-top:10px}
.week{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--soft);height:100%;justify-content:flex-end}
.week .stack{width:100%;max-width:36px;display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.week .s{background:var(--sky-deep);border-radius:4px 4px 0 0}.week .r{background:var(--rain)}
.guide h1{font-size:30px}.guide h2{margin-top:30px}.guide h3{margin-top:18px}.guide p,.guide li{max-width:74ch}
.guide blockquote{margin:10px 0;padding:10px 14px;border-left:3px solid var(--rain);background:var(--rain-soft);border-radius:0 10px 10px 0;white-space:pre-wrap}
.progress{height:8px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:8px}
.progress i{display:block;height:100%;background:var(--rain);transition:width .3s}
.ellipsis{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.step{display:flex;gap:10px;align-items:flex-start;margin:8px 0}
.step .n{flex:none;width:24px;height:24px;border-radius:50%;background:var(--line);color:var(--ink);display:grid;place-items:center;font:700 12px/1 var(--body)}
.step.done .n{background:var(--rain);color:#fff}
.step.done .t{color:var(--soft);text-decoration:line-through}
@media (max-width:720px){
  body{padding-bottom:calc(70px + env(safe-area-inset-bottom))}
  .logo small,.pill.hide-sm{display:none}
  header nav{position:fixed;left:0;right:0;bottom:0;z-index:10;background:rgba(255,255,255,.97);border-top:1px solid var(--line);padding:4px 2px calc(4px + env(safe-area-inset-bottom));gap:0;justify-content:space-around}
  nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px;font-size:10px;border-bottom:0;border-top:3px solid transparent;min-height:54px}
  nav button.on{border-top-color:var(--rain)}
  nav button svg{display:block;width:22px;height:22px}
  nav button.more{display:none}
  .count{position:absolute;top:2px;right:calc(50% - 22px);margin:0;font-size:10px;padding:0 5px}
  main{padding:14px 12px 24px}
  .card{padding:14px}
  .grid2,.grid3{grid-template-columns:1fr}
  .filters{grid-template-columns:1fr 1fr}
  .filters input[type=search]{grid-column:1/-1}
  input,select,textarea{font-size:16px}
  dialog{width:100vw;max-width:100vw;height:100dvh;max-height:100dvh;margin:0;border-radius:0}
  .dlg-body{max-height:calc(100dvh - 64px)}
  .rewrite{flex-direction:column}
  .toast{bottom:calc(84px + env(safe-area-inset-bottom))}
  .kpis{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>
<header>
  <div class="top">
    <a class="logo" href="#today"><img src="/icon.svg" alt=""><span id="siteName">Baby Bodega</span><small>Brands</small></a>
    <div class="spacer"></div>
    <span class="pill hide-sm" id="sentPill"></span>
    <button class="iconbtn" title="Settings" aria-label="Settings" onclick="openSettings()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 0 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 0 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 0 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 0 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  </div>
  <nav id="tabs">
    <button data-tab="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Today</button>
    <button data-tab="brands"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>Brands</button>
    <button data-tab="drafts"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/></svg>Drafts<span class="count" id="dCount" hidden></span></button>
    <button data-tab="replies"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>Replies<span class="count" id="rCount" hidden></span></button>
    <button data-tab="affiliates"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg>Affiliates</button>
    <button data-tab="permissions" class="more">Image rights</button>
    <button data-tab="stats" class="more">Results</button>
    <button data-tab="guide" class="more">Guide</button>
  </nav>
</header>
<main>
  <div id="banners"></div>
  <section id="tab-today"></section>
  <section id="tab-brands" hidden></section>
  <section id="tab-drafts" hidden></section>
  <section id="tab-replies" hidden></section>
  <section id="tab-affiliates" hidden></section>
  <section id="tab-permissions" hidden></section>
  <section id="tab-stats" hidden></section>
  <section id="tab-guide" class="guide" hidden></section>
</main>
<dialog id="dlg"><div class="dlg-head"><h3 id="dlgTitle" class="ellipsis" style="flex:1;font-size:19px"></h3><button class="btn sm ghost" onclick="closeDlg()">Close</button></div><div class="dlg-body" id="dlgBody"></div></dialog>

<script>
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const parse = (s, d) => { try { return s ? JSON.parse(s) : d; } catch { return d; } };
const q = encodeURIComponent;
const dlg = $('#dlg');
let S = {}; // summary
let FILTERS = { sections: [], statuses: [], asks: {} };
const bf = { q: '', status: '', section: '', contact: '', image_status: '', affiliate_status: '', kind: '', researched: '', sort: 'score', hide_done: '1' };
let replyState = 'open', currentBrand = null;

async function api(path, opts = {}) {
  const r = await fetch(path, { ...opts, headers: { 'content-type': 'application/json', ...(opts.headers || {}) } });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || `Request failed (${r.status})`);
  return data;
}
const post = (path, body = {}) => api(path, { method: 'POST', body: JSON.stringify(body) });
function toast(msg) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 3800); }
const label = (s) => String(s || '').replace(/_/g, ' ');
const when = (s) => s ? new Date(String(s).replace(' ', 'T') + (/[zZ]|[+-]\d\d:?\d\d$/.test(s) ? '' : 'Z')).toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }) : '';
const todayStr = () => new Date().toLocaleDateString('en-CA');
const money = (n) => n ? '$' + Math.round(n).toLocaleString() : '';
const TONE = { approved: 'good', partner: 'good', replied: 'good', received: 'good', found: 'info', applied: 'info', asked: 'info', ready: 'info', contacted: 'info',
  declined: 'bad', do_not_contact: 'bad', no_program: 'warn', skipped: 'warn', research: '' };
const tag = (s, txt) => `<span class="tag ${TONE[s] || ''}">${esc(txt || label(s))}</span>`;
const ASK_LABEL = { image_status: 'Images', affiliate_status: 'Affiliate', sample_status: 'Samples', collab_status: 'Social feature', feed_status: 'Spec data' };
const ASK_KEY = { images: 'image_status', affiliate: 'affiliate_status', samples: 'sample_status', collab: 'collab_status', feed: 'feed_status' };
const ASK_NAME = { images: 'Image permission', affiliate: 'Affiliate program', samples: 'Product samples', collab: 'TikTok / social feature', feed: 'Spec sheets & data feed' };
const NETWORKS = { impact: 'Impact', awin: 'Awin / ShareASale', cj: 'CJ', avantlink: 'AvantLink', rakuten: 'Rakuten', partnerize: 'Partnerize', amazon: 'Amazon only', in_house: 'In-house', other: 'Other' };

// ---------- tabs ----------
const LOADERS = { today: loadToday, brands: loadBrands, drafts: loadDrafts, replies: loadReplies, affiliates: loadAffiliates, permissions: loadPermissions, stats: loadStats, guide: loadGuide };
function showTab(name) {
  if (!LOADERS[name]) name = 'today';
  $$('#tabs button').forEach((b) => b.classList.toggle('on', b.dataset.tab === name));
  $$('main > section').forEach((s) => (s.hidden = s.id !== 'tab-' + name));
  if (location.hash !== '#' + name) history.replaceState(null, '', '#' + name);
  LOADERS[name]().catch((e) => toast(e.message));
}
$('#tabs').addEventListener('click', (e) => { const b = e.target.closest('button[data-tab]'); if (b) showTab(b.dataset.tab); });

async function refreshSummary() {
  S = await api('/api/summary');
  $('#siteName').textContent = S.settings.site_name;
  document.title = `${S.settings.site_name} Brands`;
  $('#sentPill').textContent = S.sendBlocker ? 'Sending off' : `${S.sentToday}/${S.settings.daily_cap} sent today`;
  const dc = $('#dCount'); dc.hidden = !S.drafts; dc.textContent = S.drafts;
  const rc = $('#rCount'); rc.hidden = !S.unread; rc.textContent = S.unread;
  const b = [];
  const g = new URLSearchParams(location.search).get('gmail');
  if (g) { b.push(`<div class="banner ${g === 'connected' ? 'info' : 'bad'}"><span>${g === 'connected' ? 'Gmail connected.' : esc(g)}</span></div>`); history.replaceState(null, '', '/' + location.hash); }
  $('#banners').innerHTML = b.join('');
}

// ---------- first run: load the product list ----------
async function importRows(columns, rows, onProgress) {
  const size = 300; let done = 0, newBrands = 0;
  for (let i = 0; i < rows.length; i += size) {
    const r = await post('/api/import', { columns, rows: rows.slice(i, i + size) });
    done += r.products; newBrands += r.newBrands; onProgress?.(Math.min(1, (i + size) / rows.length));
  }
  const fin = await post('/api/import/finish');
  return { done, newBrands, ...fin };
}
async function loadSeed(btn) {
  btn.disabled = true; const bar = $('#seedBar'); bar.hidden = false;
  try {
    const seed = await api('/seed.json');
    const r = await importRows(seed.columns, seed.rows, (p) => (bar.firstElementChild.style.width = Math.round(p * 100) + '%'));

function parseCSV(text) {
  const rows = []; let row = [], f = '', i = 0, inQ = false;
  text = text.replace(/^﻿/, '');
  while (i < text.length) {
    const c = text[i];
    if (inQ) { if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else inQ = false; } else f += c; }
    else if (c === '"') inQ = true;
    else if (c === ',') { row.push(f); f = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(f); f = ''; if (row.some((x) => x !== '')) rows.push(row); row = []; }
    else f += c;
    i++;
  }
  row.push(f); if (row.some((x) => x !== '')) rows.push(row);
  return rows;
}

// ---------- DRAFTS ----------
function draftCard(m) {
  const blocked = S.sendBlocker;
  const kindTag = m.kind === 'followup' ? tag('info', 'Follow-up') : m.kind === 'reply' ? tag('good', 'Answer to their reply') : parse(m.asks, []).map((a) => tag('', ASK_NAME[a] || a)).join('');
  return `<div class="card" data-msg="${m.id}">
    <div class="row"><b style="flex:1;cursor:pointer" data-brandlink="${m.brand_id}">${esc(m.brand)}</b>${kindTag}</div>
    <label class="f">To</label><input class="m-to" value="${esc(m.to_email || '')}" placeholder="${m.contact_url ? 'No email: use their contact form, then press I sent it myself' : 'Add their email'}" style="width:100%">
    ${!m.to_email && m.contact_url ? `<div class="small" style="margin-top:4px"><a href="${esc(m.contact_url)}" target="_blank" rel="noopener">Open their contact form</a></div>` : ''}
    <label class="f">Subject</label><input class="m-subj" value="${esc(m.subject)}" style="width:100%">
    <label class="f">Email</label><textarea class="m-body">${esc(m.body)}</textarea>
    <div class="sig">${esc(S.signature || '')}</div>
    ${S.claude.set && m.kind !== 'followup' ? `<div class="rewrite"><input class="m-fb" placeholder="Tell Claude what to change, e.g. shorter, more casual, mention the Vista V3"><button class="btn sm" data-mact="rewrite">Rewrite</button></div>
      <div class="chips">${['Shorter', 'More casual', 'Lead with the affiliate question', 'Warmer opening', 'Mention TikTok plans'].map((c) => `<button class="chip" data-chip="${esc(c)}">${esc(c)}</button>`).join('')}</div>` : ''}
    ${m.error ? `<div class="banner bad" style="margin-top:10px"><span>${esc(m.error)}</span></div>` : ''}
    <div class="row" style="margin-top:12px">
      <button class="btn primary" data-mact="send" ${blocked ? `disabled title="${esc(blocked)}"` : ''}>Approve & send</button>
      <button class="btn ghost" data-mact="copy">Copy</button>
      <button class="btn ghost" data-mact="manual">I sent it myself</button>
      <span class="spacer"></span>
      <button class="btn danger" data-mact="skip">Discard</button>
    </div>
    ${blocked ? `<div class="small muted" style="margin-top:6px">Sending is off: ${esc(blocked)}</div>` : ''}
  </div>`;
}
async function loadDrafts() {
  await refreshSummary();
  const list = await api('/api/queue');
  $('#tab-drafts').innerHTML = `<div class="row" style="margin-bottom:10px"><h2 style="flex:1">Drafts</h2><span class="muted small">${list.length} waiting · nothing sends until you approve it</span></div>
    ${list.map(draftCard).join('') || '<div class="empty">No drafts. Open a brand and press Write email.</div>'}`;
}
async function saveDraft(card) {
  await post(`/api/messages/${card.dataset.msg}`, { to_email: $('.m-to', card).value, subject: $('.m-subj', card).value, body: $('.m-body', card).value });
}
document.addEventListener('change', async (e) => {
  const card = e.target.closest('[data-msg]');
  if (card && e.target.matches('.m-to,.m-subj,.m-body')) { try { await saveDraft(card); } catch (err) { toast(err.message); } }
});
document.addEventListener('click', async (e) => {
  const chip = e.target.closest('[data-chip]');
  if (chip) { const card = chip.closest('[data-msg]'); $('.m-fb', card).value = chip.dataset.chip; $('[data-mact=rewrite]', card).click(); return; }
  const bl = e.target.closest('[data-brandlink]'); if (bl) { openBrand(Number(bl.dataset.brandlink)); return; }
  const b = e.target.closest('[data-mact]'); if (!b) return;
  const card = b.closest('[data-msg]'), id = card.dataset.msg, act = b.dataset.mact;
  const after = async () => { await refreshSummary(); if (currentBrand && dlg.open) openBrand(currentBrand); else loadDrafts(); };
  try {
    if (act === 'copy') {
      const text = `${$('.m-body', card).value}\n${S.signature}`;
      await navigator.clipboard.writeText(`Subject: ${$('.m-subj', card).value}\n\n${text}`); toast('Copied subject and email'); return;
    }
    b.disabled = true;
    if (act === 'send') { await saveDraft(card); await post(`/api/messages/${id}/send`); toast('Sent'); }
    if (act === 'manual') {
      const how = prompt('How did you send it? (contact form, my Growthopedia inbox, Instagram DM…)', $('.m-to', card).value ? 'another inbox' : 'contact form');
      if (how === null) { b.disabled = false; return; }
      await saveDraft(card); await post(`/api/messages/${id}/manual`, { how }); toast('Logged as sent');
    }
    if (act === 'skip') { if (!confirm('Discard this draft?')) { b.disabled = false; return; } await post(`/api/messages/${id}/skip`); }
    if (act === 'rewrite') {
      const fb = $('.m-fb', card).value.trim(); if (!fb) { b.disabled = false; return toast('Type what to change'); }
      b.textContent = 'Rewriting…';
      const r = await post(`/api/messages/${id}/rewrite`, { feedback: fb, subject: $('.m-subj', card).value, body: $('.m-body', card).value });
      $('.m-subj', card).value = r.subject; $('.m-body', card).value = r.body; $('.m-fb', card).value = ''; b.textContent = 'Rewrite'; b.disabled = false; return;
    }
    await after();
  } catch (err) { toast(err.message); b.disabled = false; if (act === 'rewrite') b.textContent = 'Rewrite'; }
});

async function loadReplies() {
  await refreshSummary();

  $('#tab-replies').innerHTML = `<div class="row" style="margin-bottom:10px"><h2 style="flex:1">Replies</h2>
      ${S.gmail.connected ? `<button class="btn sm ghost" id="chkNow">Check Gmail now</button>` : ''}</div>
    <div class="row" style="margin-bottom:12px">${seg('open', 'Needs answer')}${seg('unmatched', 'Unmatched')}${seg('all', 'All')}</div>
    ${replyState === 'unmatched' ? '<p class="small muted">Mail that came in through forwarding but didn\'t match a brand. Pick the brand to file it.</p>' : ''}
    <datalist id="brandNames">${brands.map((b) => `<option value="${esc(b.name)}" data-id="${b.id}">`).join('')}</datalist>
    ${list.map((r) => replyState === 'unmatched' ? `<div class="card" data-reply="${r.id}"><div class="row"><b style="flex:1">${esc(r.from_email || '')}</b><span class="small muted">${when(r.received_at)}</span></div>
      <div class="small muted">${esc(r.subject || '')}</div><div style="margin-top:6px;white-space:pre-wrap">${esc((r.body || r.snippet || '').slice(0, 1500))}</div>
      <div class="row" style="margin-top:10px"><input list="brandNames" class="assignName" placeholder="Brand name" style="flex:1;min-width:180px">
      <label class="chk"><input type="checkbox" class="addC" checked> Save sender as a contact</label>
      <button class="btn sm primary" data-ract="assign">File it</button><button class="btn sm ghost" data-ract="done">Not a brand</button></div></div>` : replyMini(r)).join('')
      || `<div class="empty">${replyState === 'open' ? 'Nothing waiting on you.' : 'Nothing here.'}</div>`}`;
  $('#chkNow')?.addEventListener('click', async () => { try { const r = await post('/api/check-replies'); toast(`Checked. ${r.found || 0} new.`); loadReplies(); } catch (e) { toast(e.message); } });
  window.__brandIds = Object.fromEntries(brands.map((b) => [b.name.toLowerCase(), b.id]));
}
document.addEventListener('click', async (e) => {
  const b = e.target.closest('[data-ract]'); if (!b) return;
  const card = b.closest('[data-reply]'), id = card.dataset.reply;
  try {
    b.disabled = true;
    if (b.dataset.ract === 'done') await post(`/api/replies/${id}`, { handled: true });
    if (b.dataset.ract === 'assign') {
      const bid = (window.__brandIds || {})[$('.assignName', card).value.trim().toLowerCase()];
      if (!bid) { b.disabled = false; return toast('Pick a brand from the list'); }
      await post(`/api/replies/${id}`, { brand_id: bid, add_contact: $('.addC', card).checked });
    }
    if (b.dataset.ract === 'answer') {
      const note = prompt('Anything Claude should know for the answer? (optional)', ''); if (note === null) { b.disabled = false; return; }
      b.textContent = 'Writing…'; await post(`/api/replies/${id}/answer`, { note }); toast('Draft ready in Drafts'); await refreshSummary(); showTab('drafts'); return;
    }
    await refreshSummary();
    if (!$('#tab-today').hidden) loadToday(); else loadReplies();
  } catch (err) { toast(err.message); b.disabled = false; }
});

    const total = order.reduce((a, k) => a + (obj[k] || 0), 0) || 1;
    return `<div class="track">${order.map((k, i) => `<i style="width:${((obj[k] || 0) / total) * 100}%;background:${colors[i]}" title="${label(k)}: ${obj[k] || 0}"></i>`).join('')}</div>`;
  };
  const C = ['#cbdcd2', '#476a87', '#3f7364', '#ffd666', '#a1452f', '#5a6f68'];

  const max = Math.max(1, ...s.byWeek.map((w) => w.sent));
  $('#tab-stats').innerHTML = `<h2 style="margin-bottom:12px">Results</h2>

    ${s.expiring.length ? `<div class="banner warn"><span>Image permission ending soon: ${s.expiring.map((e) => `${esc(e.brand)} (${esc(e.expires_on)})`).join(', ')}. Ask to renew or take the images down.</span></div>` : ''}
    <div class="card bars"><h3 style="margin-bottom:8px">Asks</h3>
      ${row('image_status', ['none', 'asked', 'replied', 'approved', 'declined'])}
      ${row('affiliate_status', ['none', 'found', 'applied', 'approved', 'declined', 'no_program'])}
      ${row('sample_status', ['none', 'asked', 'approved', 'received', 'declined'])}
      ${row('collab_status', ['none', 'asked', 'approved', 'declined'])}
      ${row('feed_status', ['none', 'asked', 'approved', 'declined'])}</div>
    <div class="card"><h3>First emails per week</h3><div class="small muted">Gray: sent (${s.sent} by Gmail, ${s.sentManual} by hand) · green: brands that replied</div>

    <div class="grid2">${f('site_name', 'Site name', 'Baby Bodega')}${f('site_url', 'Site address (goes in your signature)', 'https://babybodega.com')}</div>
    <label class="f">About the site: the only facts Claude may use in emails. Keep it honest and update it at launch.</label>
    <textarea data-set="about" style="min-height:120px">${esc(s.about || '')}</textarea>

    <h3 style="margin-top:22px">Sending</h3>
    <div class="grid2">${f('sender_name', 'Your name', 'Jen Cannizzo')}${f('sender_email', 'Sending address (the new inbox)', 'hello@yourdomain.com', 'email')}</div>
    ${f('business_address', 'Mailing address (required by US law in business email; a PO box or virtual mailbox works)', 'PO Box …')}
    <div class="grid2">${f('daily_cap', 'Daily send limit', '15')}${f('own_emails', 'Your other addresses (comma separated)', 'jen.cannizzo@growthopedia.com')}</div>
    ${f('forward_to', 'Forward incoming mail to (for Cloudflare Email Routing; must be verified there)', 'jen.cannizzo@growthopedia.com', 'email')}
    <div class="row" style="margin-top:10px"><button class="btn primary" id="setSave">Save settings</button></div>
    <div class="sig" style="margin-top:12px"><b>Signature preview</b>\n${esc(S.signature || '')}</div>

    <h3 style="margin-top:22px">Claude key</h3>
    <p class="small muted">${S.claude.set ? `Saved (${esc(S.claude.hint)})${S.claude.fromEnv ? ', from the Cloudflare secret' : ''}.` : 'Not set. Research and Claude-written emails are off; emails use a plain template.'} Stored in the app's database, never in the code.</p>
    <div class="row"><input id="ckey" type="password" placeholder="sk-ant-…" style="flex:1;min-width:220px" autocomplete="off"><button class="btn" id="ckeySave">Save key</button></div>

    <h3 style="margin-top:22px">Gmail</h3>
    <p class="small muted">${S.gmail.connected ? `Connected as ${esc(S.gmail.account || 'your inbox')}.` : 'Not connected. Do this once the new inbox exists (Guide → Sending).'}</p>
    ${S.gmail.fromEnv ? '' : `<div class="grid2"><div><label class="f">Google Client ID</label><input id="gid" placeholder="….apps.googleusercontent.com"></div>
      <div><label class="f">Client secret</label><input id="gsec" type="password" placeholder="GOCSPX-…"></div></div>
      <div class="small muted" style="margin-top:6px">Redirect URI to add in Google Cloud: <code>${esc(location.origin)}/oauth/callback</code></div>`}
    <div class="row" style="margin-top:10px">${S.gmail.fromEnv ? '' : '<button class="btn" id="gSave">Save Google client</button>'}
      <a class="btn ${S.gmail.clientSaved ? 'primary' : 'ghost'}" href="/oauth/start" ${S.gmail.clientSaved ? '' : 'onclick="toast(\'Save the Google client first\');return false"'}>${S.gmail.connected ? 'Reconnect Gmail' : 'Connect Gmail'}</a>
      ${S.gmail.connected ? '<button class="btn danger" id="gOff">Disconnect</button>' : ''}</div>

    <h3 style="margin-top:22px">Product list</h3>
    <p class="small muted">${S.brands} brands, ${S.products.toLocaleString()} products${S.lastImport ? ` · last loaded ${when(S.lastImport)}` : ''}. Upload the updated CSV (same columns as before) to add new products and brands. Your contacts, notes and emails stay.</p>
    <div class="row"><input type="file" id="csvFile" accept=".csv,text/csv"><button class="btn" id="csvGo">Import CSV</button></div>
    <div class="progress" id="csvBar" hidden><i style="width:0"></i></div>

    <h3 style="margin-top:22px">Exports</h3>
    <div class="links"><a class="lk" href="/api/export/brands.csv">All brands</a><a class="lk" href="/api/export/contacts.csv">Contacts</a><a class="lk" href="/api/export/affiliates.csv">Affiliate programs</a><a class="lk" href="/api/export/permissions.csv">Image permissions</a></div>`);
  $('#setSave').onclick = async () => {
    const body = {}; $$('[data-set]').forEach((i) => (body[i.dataset.set] = i.value));
    try { await post('/api/settings', body); await refreshSummary(); toast('Saved'); openSettings(); } catch (e) { toast(e.message); }
  };
  $('#ckeySave').onclick = async () => {
    try { await post('/api/settings/claude', { key: $('#ckey').value }); await refreshSummary(); toast('Key saved'); openSettings(); } catch (e) { toast(e.message); }
  };
  $('#gSave')?.addEventListener('click', async () => {
    try { await post('/api/gmail/client', { client_id: $('#gid').value, client_secret: $('#gsec').value }); await refreshSummary(); toast('Saved. Now Connect Gmail.'); openSettings(); } catch (e) { toast(e.message); }
  });
  $('#gOff')?.addEventListener('click', async () => { if (!confirm('Disconnect Gmail?')) return; await post('/api/gmail/disconnect'); await refreshSummary(); openSettings(); });
  $('#csvGo').onclick = async () => {
    const file = $('#csvFile').files[0]; if (!file) return toast('Choose the CSV first');
    const rows = parseCSV(await file.text()); if (rows.length < 2) return toast('That file looks empty');
    const bar = $('#csvBar'); bar.hidden = false;
    try {
      const r = await importRows(rows[0], rows.slice(1), (p) => (bar.firstElementChild.style.width = Math.round(p * 100) + '%'));
      toast(`Imported ${r.done.toLocaleString()} products. ${r.newBrands} new brands.`); await refreshSummary(); FILTERS = { sections: [], statuses: [], asks: {} }; openSettings();
    } catch (e) { toast(e.message); }
  };
}

// ---------- start ----------
(async () => {
  try { await refreshSummary(); } catch (e) { toast(e.message); }
  if (!FILTERS.sections.length) FILTERS = await api('/api/filters').catch(() => FILTERS);
  showTab((location.hash || '#today').slice(1));
})();
</script>
</body>
</html>
